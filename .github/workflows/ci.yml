name: CI

# Runs on every push and pull request. Nothing here deploys, and no job needs a
# database credential: the test suite is isolated from Neon by tests/conftest.py,
# and the container job talks to the API's own "no database" default.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Belt and braces with tests/conftest.py: never let a developer's .env (which
      # is not in the checkout) or a repository secret wire tests to a real DB.
      DATABASE_URL: ""
      MODEL_PATH: artifacts/models/fraud_model.joblib
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # LTS line; the project's Vite 8 requires >= 20.19 or >= 22.12.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        # `npm run build` = tsc --noEmit && vite build
        run: npm run build

      - name: Assert the bundle carries no server-side configuration
        run: |
          if grep -rIl -E 'DATABASE_URL|neon\.tech|postgresql://' dist/; then
            echo "::error::A server-side value leaked into the frontend bundle."
            exit 1
          fi
          echo "Bundle contains no database URL or Neon host."

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build the frontend image
        run: |
          docker build \
            --tag fraudguard-frontend:ci \
            --build-arg VITE_API_BASE_URL=http://127.0.0.1:8000 \
            ./frontend

      - name: Smoke-test the frontend image
        run: |
          docker run -d --name fg-frontend -p 8080:80 fraudguard-frontend:ci
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # SPA fallback: an unknown route must serve the app shell, not a 404.
          curl -fsS http://127.0.0.1:8080/alerts | grep -q '<div id="root">'
          echo "Frontend serves the app shell and SPA fallback."

      # The deployment bundle is git-ignored on purpose (artifacts/* in
      # .gitignore), so a fresh checkout has no model and the backend image cannot
      # be built here. That is a repository policy, not a broken Dockerfile: build
      # it locally after scripts/train_models.py has produced the artifact.
      - name: Look for the model artifact
        id: artifact
        run: |
          if [ -f artifacts/models/fraud_model.joblib ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend image not built::artifacts/models/fraud_model.joblib is git-ignored, so it is absent from a fresh checkout. Build the backend image locally once the artifact exists."
          fi

      - name: Build the backend image
        if: steps.artifact.outputs.present == 'true'
        run: docker build --tag fraudguard-backend:ci .

      - name: Smoke-test the backend image
        if: steps.artifact.outputs.present == 'true'
        run: |
          docker run -d --name fg-backend -p 8000:8000 fraudguard-backend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          # No secrets, datasets or notebooks may have been copied into the image.
          docker run --rm fraudguard-backend:ci sh -c \
            'test ! -e /app/.env && test ! -d /app/data && test ! -d /app/tests && echo "image content checked"'

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs fg-backend || true
          docker logs fg-frontend || true

      - name: Clean up containers
        if: always()
        run: docker rm -f fg-backend fg-frontend || true
