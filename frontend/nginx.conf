# Served by the frontend container. The app is a single-page React build produced
# by Vite, so unknown paths must return index.html rather than a 404.

server {
    listen       80;
    server_name  _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route that is not a real file serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached: it references hashed asset names, and a
    # stale copy would keep pointing at files that no longer exist.
    # `expires` is used instead of add_header so the server-level security headers
    # above stay inherited (a location-level add_header would replace them).
    location = /index.html {
        expires -1;
    }

    # Vite emits content-hashed files under /assets/, so they can be cached for a
    # year. A missing asset is a real 404, not a route.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
